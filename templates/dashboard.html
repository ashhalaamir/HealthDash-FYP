<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthDash</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1a1e; --side:#09141a; --panel:#14272d; --line:#244048; --grid:rgba(255,255,255,.08);
  --ink:#e9f4f2; --mute:#8fb1ab; --cur:#2dd4bf; --alt:#f5b942; --base:#5f7f8a;
  --good:#7ddc8a; --bad:#ff7b7b; --on-cur:#04201c; --on-alt:#2a1d00; --on-bad:#2a0a0a;
  --p1:#2dd4bf; --p2:#f5b942; --p3:#60a5fa; --p4:#f472b6; --p5:#a3e635; --p6:#fb923c;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f3f7f6; --side:#ffffff; --panel:#ffffff; --line:#d3e1de; --grid:rgba(0,0,0,.08);
  --ink:#10262b; --mute:#587771; --cur:#0f9d8a; --alt:#d98e04; --base:#92a8ae;
  --good:#1e9d55; --bad:#d64545; --on-cur:#ffffff; --on-alt:#ffffff; --on-bad:#ffffff;
  --p1:#0f9d8a; --p2:#d98e04; --p3:#2f6fd6; --p4:#d6458f; --p5:#6aa31a; --p6:#e0701f;
}}
[hidden]{display:none!important}
.card,.ins{box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.tab:hover{border-color:var(--cur)}
.tab[aria-selected=true]{background:var(--cur);border-color:var(--cur);color:var(--on-cur);font-weight:700}
.tab:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.tbl{overflow-x:auto}
.cmp-t{width:100%;border-collapse:collapse;font-size:14px}
.cmp-t th,.cmp-t td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp-t th:first-child,.cmp-t td:first-child{text-align:left}
.cmp-t th{cursor:pointer;color:var(--mute);font-weight:600;font-size:13px}
.cmp-t th:hover{color:var(--ink)}
.star{color:var(--alt);font-weight:800}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Manrope","Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;border-right:1px solid var(--line)}
aside h1{font-size:22px;font-weight:800;letter-spacing:.02em}
aside .dates{color:var(--mute);font-size:13px;margin:6px 0 24px}
aside h3{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px}
.btn{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:8px;margin-bottom:7px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--alt)}
.btn.on{background:var(--cur);border-color:var(--cur);color:var(--on-cur);font-weight:700}
.btn:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
main{flex:1;padding:24px;min-width:0}
.ins{background:var(--panel);border-radius:10px;padding:16px 18px;margin-bottom:14px;border-left:4px solid var(--cur)}
.ins .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ins h2{font-size:14px;font-weight:600;color:var(--mute)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.badge.ai{background:var(--alt);color:var(--on-alt)}
.ins .scope{color:var(--mute);font-size:13px;margin-bottom:8px}
.ins .sum{font-size:16px;line-height:1.55}
.ins .note{color:var(--mute);font-size:12px;margin-top:8px}
.ins details{margin-top:12px}
.ins summary{cursor:pointer;color:var(--mute);font-size:13px}
.alerts{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chip{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.chip.high{background:var(--bad);color:var(--on-bad)}
.chip.medium{background:var(--alt);color:var(--on-alt)}
.chip.low{background:var(--line);color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:14px;font-weight:600;color:var(--mute);margin-bottom:10px}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1}
.kpi .d{font-size:13px;margin-top:6px;color:var(--mute)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.chart{position:relative;height:250px}
.cmp{margin-top:32px}
.cmp>h2{font-size:20px;font-weight:800;margin-bottom:4px}
.cmp>p{color:var(--mute);font-size:13px;margin-bottom:14px}
.cmp .chart{height:340px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.live{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;color:var(--mute);font-size:13px;margin-bottom:12px}
.live[hidden],.since[hidden]{display:none}
.live .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:6px}
.live.stale .dot{background:var(--bad)}
.since{margin-bottom:14px}
.since .meta{color:var(--mute);font-size:13px;margin:0 0 10px}
.since ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.since li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
@media(max-width:900px){
  body{flex-direction:column}
  aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  aside #dims{display:flex;gap:7px;overflow-x:auto}
  aside .btn{width:auto;white-space:nowrap;margin:0}
  .grid>.card{grid-column:span 12!important}
}
</style>
</head>
<body>
<aside>
  <h1 id="title"></h1>
  <p class="dates" id="dates"></p>
  <h3>Compare by</h3>
  <div id="dims"></div>
</aside>
<main>
  <div class="live" id="live" hidden><span><span class="dot"></span><b>Live</b></span><span id="liveSnap"></span><span id="liveAge"></span><span id="liveWin"></span></div>
  <section class="ins" id="insights" hidden>
    <div class="top"><h2>Summary</h2><span class="badge" id="insBadge"></span></div>
    <p class="scope" id="insScope"></p>
    <p class="sum" id="insSum"></p>
    <p class="note" id="insNote"></p>
    <details open><summary>Key findings (<span id="alertCount">0</span>)</summary><ul class="alerts" id="alerts"></ul></details>
  </section>
  <section class="card since" id="since" hidden><h2>Since the last refresh</h2><p class="meta" id="sinceMeta"></p><ul id="sinceList"></ul></section>
  <section class="kpis" id="kpis"></section>
  <section class="grid" id="grid"></section>
  <section class="cmp" id="cmp">
    <h2>Change over time</h2>
    <p id="cmpNote"></p>
    <div class="card"><h2 id="cmpTitle"></h2>
      <div class="tabs" id="cmpTabs" role="tablist" aria-label="Comparison view"></div>
      <p class="hint" id="cmpHint"></p>
      <div class="chart" id="cmpChartBox"><canvas id="cmpChart"></canvas></div>
      <div class="tbl" id="cmpTable" hidden></div></div>
  </section>
</main>

<!--
  PAYLOAD: renderer.py replaces the JSON below with {"spec": ..., "data": ...}.
  spec.widgets[].type: kpi | trend | breakdown | combo
  data.widgets[id] = {current, baseline}
    kpi:       {value}
    trend:     {labels, values}
    breakdown: {labels, values}
    combo:     {labels, bar, line}
-->
<script id="payload" type="application/json">
{
 "spec": {
  "title": "CLARITY",
  "widgets": [
   {"id":"visits","type":"kpi","label":"Total OPD visits"},
   {"id":"patients","type":"kpi","label":"Unique patients"},
   {"id":"vas","type":"kpi","label":"Average follow-up VAS","higher_is_better":false},
   {"id":"extra","type":"kpi","label":"Additional visits","higher_is_better":false},
   {"id":"trend","type":"trend","label":"Daily OPD visit trend","span":6},
   {"id":"gender","type":"breakdown","chart":"donut","label":"Visits by gender","span":3},
   {"id":"age","type":"breakdown","chart":"bar","label":"Visits by age","span":3},
   {"id":"diag","type":"breakdown","chart":"bar","label":"Visits by diagnosis","span":4},
   {"id":"treat","type":"breakdown","chart":"bar","label":"Visits by treatment","span":4},
   {"id":"inv","type":"breakdown","chart":"donut","label":"Visits by investigation","span":4},
   {"id":"vasc","type":"combo","label":"Visits and average VAS by complaint","span":12,"bar_label":"Visits","line_label":"Avg VAS"}
  ]
 },
 "insights": {
  "source": "template", "scope": "All records", "notes": [],
  "summary": "Total OPD visits rose 18% (128 to 151). Average follow-up VAS fell 16% (1.71 to 1.44).",
  "findings": [
   {"severity":"high","text":"Activity peaked at 13 on Sep 06, well above the typical 6 per week."},
   {"severity":"medium","text":"Average follow-up VAS fell 16% (1.71 to 1.44)."},
   {"severity":"low","text":"'X-Ray' makes up 77% of visits by investigation."}]},
 "data": {
  "dates": {"baseline":"2026-10-01","current":"2026-10-30"},
  "widgets": {
   "visits":  {"current":{"value":151},"baseline":{"value":128}},
   "patients":{"current":{"value":137},"baseline":{"value":119}},
   "vas":     {"current":{"value":1.44},"baseline":{"value":1.71}},
   "extra":   {"current":{"value":14},"baseline":{"value":9}},
   "trend":{
    "current":{"labels":["Aug 30","Sep 02","Sep 06","Sep 09","Sep 13","Sep 16","Sep 20","Sep 23","Sep 27","Sep 30"],"values":[2,6,13,5,9,6,8,4,7,5]},
    "baseline":{"labels":["Aug 30","Sep 02","Sep 06","Sep 09","Sep 13","Sep 16","Sep 20","Sep 23","Sep 27","Sep 30"],"values":[2,5,10,4,8,5,6,3,5,4]}},
   "gender":{"current":{"labels":["Female","Male"],"values":[56,95]},"baseline":{"labels":["Female","Male"],"values":[48,80]}},
   "age":{"current":{"labels":["Under 18","18-39","40-59","60+"],"values":[11,43,55,42]},"baseline":{"labels":["Under 18","18-39","40-59","60+"],"values":[9,36,47,36]}},
   "diag":{"current":{"labels":["LBP non-radiation","Muscular back pain","Lower back pain","Muscular spasm","Not recorded","Shoulder dislocation"],"values":[15,9,7,7,7,6]},
           "baseline":{"labels":["LBP non-radiation","Muscular back pain","Lower back pain","Muscular spasm","Not recorded","Shoulder dislocation"],"values":[12,8,5,6,10,4]}},
   "treat":{"current":{"labels":["Meds","Meds + I.A inj","Meds + physio","Meds + backslab"],"values":[104,20,19,8]},
            "baseline":{"labels":["Meds","Meds + I.A inj","Meds + physio","Meds + backslab"],"values":[90,17,14,7]}},
   "inv":{"current":{"labels":["X-Ray","X-Ray + Lab","Lab","None"],"values":[116,23,8,4]},"baseline":{"labels":["X-Ray","X-Ray + Lab","Lab","None"],"values":[99,18,7,4]}},
   "vasc":{"current":{"labels":["Back pain","Lower back pain","Knee pain","Shoulder pain","Elbow pain"],"bar":[24,22,15,13,8],"line":[1.3,1.4,1.2,1.6,1.1]},
           "baseline":{"labels":["Back pain","Lower back pain","Knee pain","Shoulder pain","Elbow pain"],"bar":[20,19,12,10,6],"line":[1.6,1.7,1.5,1.9,1.3]}}
  }
 }
}
</script>

<script>
const {spec, data, insights, since_last, live} = JSON.parse(document.getElementById('payload').textContent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {cur: css('--cur'), alt: css('--alt'), base: css('--base')};
const PALETTE = ['--p1','--p2','--p3','--p4','--p5','--p6'].map(css);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
Chart.defaults.color = css('--mute');
Chart.defaults.font.family = '"Manrope","Segoe UI",system-ui,sans-serif';
Chart.defaults.borderColor = css('--grid');
Chart.defaults.animation = reduce ? false : {duration: 500};

const $ = id => document.getElementById(id);
const fmt = n => Number.isInteger(n) ? n.toLocaleString() : n.toFixed(2);
const W = id => data.widgets[id];

$('title').textContent = spec.title || 'Dashboard';
$('dates').textContent = `${data.dates.current} vs ${data.dates.baseline}`;


// Summary and findings: all text goes in via textContent, so data values can never inject markup
function renderInsights(ins){
  $('insights').hidden = false;
  const ai = ins.source === 'llm';
  $('insBadge').textContent = ai ? 'AI summary' : 'Auto summary';
  $('insBadge').classList.toggle('ai', ai);
  $('insScope').textContent = `${ins.scope || 'All records'}. ${data.dates.current} compared with ${data.dates.baseline}.`;
  $('insSum').textContent = ins.summary || '';
  $('insNote').textContent = (ins.notes || []).join(' ');
  const ul = $('alerts'); ul.innerHTML = '';
  for (const f of ins.findings || []){
    const li = document.createElement('li'), chip = document.createElement('span'), txt = document.createElement('span');
    chip.className = 'chip ' + (['high','medium','low'].includes(f.severity) ? f.severity : 'low');
    chip.textContent = f.severity; txt.textContent = f.text;
    li.append(chip, txt); ul.appendChild(li);
  }
  $('alertCount').textContent = (ins.findings || []).length;
}
if (insights) renderInsights(insights);

if (live){                                   // live mode: which snapshot this is, and how old it is (updates in the browser)
  $('live').hidden = false;
  $('liveSnap').textContent = `Snapshot #${live.snapshot_id}` + (live.view ? ` | ${live.view}` : '');
  $('liveWin').textContent = `${data.dates.current} vs ${data.dates.baseline}`;
  const t = new Date(live.updated_at);
  const tick = () => {
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    $('liveAge').textContent = `updated ${t.toLocaleString()} (${m < 1 ? 'just now' : m < 120 ? m + ' min ago' : Math.round(m / 60) + ' h ago'})`;
    $('live').classList.toggle('stale', live.stale_minutes != null && m > live.stale_minutes);
  };
  tick(); setInterval(tick, 30000);
}
if (since_last){                             // what moved between the previous snapshot and this one
  $('since').hidden = false;
  const n = since_last.rows_new || 0, fs = since_last.findings || [];
  $('sinceMeta').textContent = `${n.toLocaleString()} new record${n === 1 ? '' : 's'} arrived since the previous refresh.` + (fs.length ? '' : ' No notable change.');
  for (const f of fs){
    const li = document.createElement('li'), chip = document.createElement('span'), txt = document.createElement('span');
    chip.className = 'chip ' + (['high','medium','low'].includes(f.severity) ? f.severity : 'low');
    chip.textContent = f.severity; txt.textContent = f.text;
    li.append(chip, txt); $('sinceList').appendChild(li);
  }
}

function kpiCard(w){
  const d = W(w.id), cur = d.current.value, base = d.baseline ? d.baseline.value : null;
  let delta = '<span class="flat">No baseline</span>';
  if (base !== null && base !== 0){
    const pct = (cur - base) / Math.abs(base) * 100;
    const good = w.higher_is_better === false ? pct < 0 : pct > 0;
    const cls = pct === 0 ? 'flat' : good ? 'up' : 'down';
    const arrow = pct === 0 ? '–' : pct > 0 ? '▲' : '▼';
    delta = `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span> vs ${fmt(base)}`;
  }
  const el = document.createElement('div');
  el.className = 'card kpi';
  el.innerHTML = `<h2></h2><div class="v"></div><div class="d">${delta}</div>`;   // delta is built from numbers only
  el.querySelector('h2').textContent = w.label;                                      // labels can come from an LLM
  el.querySelector('.v').textContent = fmt(cur);
  return el;
}

function chartCard(w){
  const span = w.span || (w.type === 'breakdown' ? 4 : 6);
  const el = document.createElement('div');
  el.className = 'card';
  el.style.gridColumn = `span ${span}`;
  el.innerHTML = `<h2></h2><div class="chart"><canvas></canvas></div>`;
  el.querySelector('h2').textContent = w.label;
  return el;
}

function draw(canvas, w){
  const d = W(w.id), c = d.current, b = d.baseline;
  if (w.type === 'trend'){
    const sets = [{label:'Current', data:c.values, borderColor:COL.cur, backgroundColor:COL.cur, tension:.35, pointRadius:2}];
    if (b) sets.push({label:'Baseline', data:b.values, borderColor:COL.base, borderDash:[5,4], tension:.35, pointRadius:0});
    return new Chart(canvas, {type:'line', data:{labels:c.labels, datasets:sets}, options:{maintainAspectRatio:false, plugins:{legend:{display:!!b}}}});
  }
  if (w.type === 'breakdown' && w.chart === 'donut'){
    return new Chart(canvas, {type:'doughnut', data:{labels:c.labels, datasets:[{data:c.values, backgroundColor:PALETTE, borderWidth:0}]},
      options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom'}}}});
  }
  if (w.type === 'breakdown'){
    return new Chart(canvas, {type:'bar', data:{labels:c.labels, datasets:[{data:c.values, backgroundColor:COL.cur, borderRadius:3}]},
      options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}}}});
  }
  if (w.type === 'combo'){
    return new Chart(canvas, {data:{labels:c.labels, datasets:[
      {type:'bar', label:w.bar_label||'Count', data:c.bar, backgroundColor:COL.cur, borderRadius:3, yAxisID:'y'},
      {type:'line', label:w.line_label||'Average', data:c.line, borderColor:COL.alt, backgroundColor:COL.alt, tension:.35, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true}, y1:{position:'right', grid:{drawOnChartArea:false}}}}});
  }
}

for (const w of spec.widgets){
  if (w.type === 'kpi') $('kpis').appendChild(kpiCard(w));
  else { const card = chartCard(w); $('grid').appendChild(card); draw(card.querySelector('canvas'), w); }
}

// Comparison: any breakdown widget, or the bar series of a combo widget
const cmpWidgets = spec.widgets.filter(w => (w.type === 'breakdown' || w.type === 'combo') && W(w.id).baseline);
let cmpChart = null, curW = null, curView = 'side';
const VIEWS = [['side','Side by side'],['movers','Biggest movers'],['mix','Mix shift'],['contrib','Contribution'],['table','Table']];
const isCount = w => (w.type === 'combo' ? ((w.bar || {}).agg || 'count') : (w.agg || 'count')) === 'count';
const sgn = n => (n > 0 ? '+' : '') + fmt(n);
function series(p){ return p.values || p.bar; }

function rowsFor(w){            // the Python-computed rows; computed here only for older payloads
  const d = W(w.id);
  if (d.compare) return d.compare;
  const c = d.current, b = d.baseline, labels = [...new Set([...c.labels, ...b.labels])];
  const at = (p, l) => { const i = p.labels.indexOf(l); return i < 0 ? 0 : series(p)[i]; };
  const tc = labels.reduce((t, l) => t + at(c, l), 0), tb = labels.reduce((t, l) => t + at(b, l), 0);
  return labels.map(l => { const x = at(c, l), y = at(b, l);
    return {label:l, current:x, baseline:y, delta:x - y, pct:y ? (x - y) / Math.abs(y) * 100 : null,
      share_cur:tc ? x / tc * 100 : null, share_base:tb ? y / tb * 100 : null,
      shift_pp:(tc && tb) ? x / tc * 100 - y / tb * 100 : null, z:null, significant:false}; });
}

function hbar(labels, data, colors, tip){
  return new Chart($('cmpChart'), {type:'bar', data:{labels, datasets:[{data, backgroundColor:colors, borderRadius:3}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:tip}}}}});
}

function drawCompare(w){
  const rows = rowsFor(w), D = data.dates;
  if (cmpChart) { cmpChart.destroy(); cmpChart = null; }
  $('cmpChartBox').hidden = curView === 'table';
  $('cmpTable').hidden = curView !== 'table';
  let hint = '';
  if (curView === 'side'){
    hint = 'Each category in the baseline and in the current period.';
    cmpChart = new Chart($('cmpChart'), {type:'bar', data:{labels:rows.map(r => r.label), datasets:[
      {label:D.baseline, data:rows.map(r => r.baseline), backgroundColor:COL.base, borderRadius:3},
      {label:D.current, data:rows.map(r => r.current), backgroundColor:COL.cur, borderRadius:3}]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:'top'}}}});
  } else if (curView === 'movers'){
    const r = [...rows].sort((a, b) => b.delta - a.delta);
    hint = 'Change in each category, biggest rise at the top and biggest fall at the bottom.';
    cmpChart = hbar(r.map(x => x.label), r.map(x => x.delta), r.map(x => x.delta >= 0 ? COL.cur : COL.alt),
      c => { const x = r[c.dataIndex]; return `${sgn(x.delta)}${x.pct === null ? '' : ` (${sgn(Math.round(x.pct))}%)`}: ${fmt(x.baseline)} to ${fmt(x.current)}`; });
  } else if (curView === 'mix'){
    const r = rows.filter(x => x.shift_pp !== null).sort((a, b) => b.shift_pp - a.shift_pp), n = r.filter(x => x.significant).length;
    hint = `Change in each category's share of the total, in percentage points. Solid bars (${n} of ${r.length}) moved by more than chance would explain; faded bars may be noise.`;
    cmpChart = hbar(r.map(x => x.label), r.map(x => x.shift_pp), r.map(x => (x.shift_pp >= 0 ? COL.cur : COL.alt) + (x.significant ? '' : '55')),
      c => { const x = r[c.dataIndex]; return `${sgn(x.shift_pp)} pts: ${fmt(x.share_base)}% to ${fmt(x.share_cur)}%${x.significant ? ' (notable)' : ''}`; });
  } else if (curView === 'contrib'){
    const T = W(w.id).totals, r = [...rows].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    const B = T && T.baseline != null ? T.baseline : r.reduce((t, x) => t + x.baseline, 0);
    const steps = r.map(x => ({label:x.label, delta:x.delta}));
    const shown = r.reduce((t, x) => t + x.delta, 0), other = T && T.current != null ? T.current - B - shown : 0;
    if (Math.abs(other) > 1e-9) steps.push({label:'Other categories', delta:other});
    let run = B; const bars = [[0, B]], cols = [COL.base];
    for (const x of steps){ bars.push([run, run + x.delta]); cols.push(x.delta >= 0 ? COL.cur : COL.alt); run += x.delta; }
    bars.push([0, run]); cols.push(COL.base);
    hint = 'How each category moved the total, from the baseline total to the current total.';
    cmpChart = new Chart($('cmpChart'), {type:'bar', data:{labels:['Baseline total', ...steps.map(x => x.label), 'Current total'],
      datasets:[{data:bars, backgroundColor:cols, borderRadius:3}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => {
        const i = c.dataIndex; return i === 0 ? fmt(B) : i === bars.length - 1 ? fmt(run) : sgn(steps[i - 1].delta); }}}}}});
  } else {
    hint = 'Click a column heading to sort. A star marks a share shift that is unlikely to be chance.';
    drawTable(rows);
  }
  $('cmpHint').textContent = hint;
}

let sortKey = 'delta', sortDir = -1;
function drawTable(rows){
  const cols = [['label','Category'],['baseline','Baseline'],['current','Current'],['delta','Change'],['pct','% change'],['shift_pp','Share shift (pts)']];
  const r = [...rows].sort((a, b) => sortDir * (typeof a[sortKey] === 'string' ? a[sortKey].localeCompare(b[sortKey]) : (a[sortKey] ?? -Infinity) - (b[sortKey] ?? -Infinity)));
  const t = document.createElement('table'); t.className = 'cmp-t';
  const hr = t.createTHead().insertRow();
  for (const [k, name] of cols){
    const th = document.createElement('th'); th.textContent = name + (k === sortKey ? (sortDir < 0 ? ' ▼' : ' ▲') : '');
    th.onclick = () => { sortDir = k === sortKey ? -sortDir : -1; sortKey = k; drawTable(rows); };
    hr.appendChild(th);
  }
  const tb = t.createTBody();
  for (const x of r){
    const tr = tb.insertRow();
    const vals = [x.label, fmt(x.baseline), fmt(x.current), sgn(x.delta), x.pct === null ? 'new' : sgn(Math.round(x.pct)) + '%', x.shift_pp === null ? '' : sgn(x.shift_pp)];
    vals.forEach((v, i) => { const td = tr.insertCell(); td.textContent = v; if (i === 5 && x.significant){ const s = document.createElement('span'); s.className = 'star'; s.textContent = ' ★'; td.appendChild(s); } });
  }
  $('cmpTable').replaceChildren(t);
}

function renderTabs(w){
  if (!isCount(w) && ['mix', 'contrib'].includes(curView)) curView = 'side';
  const box = $('cmpTabs'); box.replaceChildren();
  for (const [id, name] of VIEWS){
    if (!isCount(w) && (id === 'mix' || id === 'contrib')) continue;
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.textContent = name; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(id === curView));
    b.onclick = () => { curView = id; renderTabs(w); drawCompare(w); };
    box.appendChild(b);
  }
}

function showCompare(w){
  curW = w;
  $('cmpTitle').textContent = w.label;
  $('cmpNote').textContent = `${data.dates.baseline} compared with ${data.dates.current}`;
  renderTabs(w); drawCompare(w);
  document.querySelectorAll('#dims .btn').forEach(x => x.classList.toggle('on', x.dataset.id === w.id));
}
if (cmpWidgets.length){
  for (const w of cmpWidgets){
    const btn = document.createElement('button');
    btn.className = 'btn'; btn.dataset.id = w.id;
    btn.textContent = (w.label || w.id || '').replace(/^.*? by /i, '').replace(/^./, s => s.toUpperCase());
    btn.onclick = () => showCompare(w);
    $('dims').appendChild(btn);
  }
  showCompare(cmpWidgets[0]);
} else {
  $('cmp').innerHTML = '<p class="empty">No baseline data to compare. Pick a second date.</p>';
}
</script>
</body>
