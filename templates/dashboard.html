<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthDash</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#150f45; --side:#100b38; --panel:#211968; --line:#352b8f;
  --ink:#f2eeff; --mute:#a69cdc; --coral:#ff8a65; --lilac:#c58bff;
  --good:#5be3a4; --bad:#ff6b7a; --grey:#7d74b8;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Manrope","Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;border-right:1px solid var(--line)}
aside h1{font-size:22px;font-weight:800;letter-spacing:.02em}
aside .dates{color:var(--mute);font-size:13px;margin:6px 0 24px}
aside h3{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px}
.btn{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:8px;margin-bottom:7px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--lilac)}
.btn.on{background:var(--coral);border-color:var(--coral);color:#2a1030;font-weight:700}
.btn:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
main{flex:1;padding:24px;min-width:0}
.ins{background:var(--panel);border-radius:10px;padding:16px 18px;margin-bottom:14px;border-left:4px solid var(--coral)}
.ins .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ins h2{font-size:14px;font-weight:600;color:var(--mute)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.badge.ai{background:var(--lilac);color:#2a1030}
.ins .scope{color:var(--mute);font-size:13px;margin-bottom:8px}
.ins .sum{font-size:16px;line-height:1.55}
.ins .note{color:var(--mute);font-size:12px;margin-top:8px}
.ins details{margin-top:12px}
.ins summary{cursor:pointer;color:var(--mute);font-size:13px}
.alerts{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chip{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.chip.high{background:var(--bad);color:#2a0a10}
.chip.medium{background:var(--coral);color:#2a1030}
.chip.low{background:var(--line);color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:14px;font-weight:600;color:var(--mute);margin-bottom:10px}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1}
.kpi .d{font-size:13px;margin-top:6px;color:var(--mute)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.chart{position:relative;height:250px}
.cmp{margin-top:32px}
.cmp>h2{font-size:20px;font-weight:800;margin-bottom:4px}
.cmp>p{color:var(--mute);font-size:13px;margin-bottom:14px}
.cmp .chart{height:340px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
@media(max-width:900px){
  body{flex-direction:column}
  aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  aside #dims{display:flex;gap:7px;overflow-x:auto}
  aside .btn{width:auto;white-space:nowrap;margin:0}
  .grid>.card{grid-column:span 12!important}
}
</style>
</head>
<body>
<aside>
  <h1 id="title"></h1>
  <p class="dates" id="dates"></p>
  <h3>Compare by</h3>
  <div id="dims"></div>
</aside>
<main>
  <section class="ins" id="insights" hidden>
    <div class="top"><h2>Summary</h2><span class="badge" id="insBadge"></span></div>
    <p class="scope" id="insScope"></p>
    <p class="sum" id="insSum"></p>
    <p class="note" id="insNote"></p>
    <details open><summary>Key findings (<span id="alertCount">0</span>)</summary><ul class="alerts" id="alerts"></ul></details>
  </section>
  <section class="kpis" id="kpis"></section>
  <section class="grid" id="grid"></section>
  <section class="cmp" id="cmp">
    <h2>Change over time</h2>
    <p id="cmpNote"></p>
    <div class="card"><h2 id="cmpTitle"></h2><div class="chart"><canvas id="cmpChart"></canvas></div></div>
  </section>
</main>

<!--
  PAYLOAD: renderer.py replaces the JSON below with {"spec": ..., "data": ...}.
  spec.widgets[].type: kpi | trend | breakdown | combo
  data.widgets[id] = {current, baseline}
    kpi:       {value}
    trend:     {labels, values}
    breakdown: {labels, values}
    combo:     {labels, bar, line}
-->
<script id="payload" type="application/json">
{
 "spec": {
  "title": "CLARITY",
  "widgets": [
   {"id":"visits","type":"kpi","label":"Total OPD visits"},
   {"id":"patients","type":"kpi","label":"Unique patients"},
   {"id":"vas","type":"kpi","label":"Average follow-up VAS","higher_is_better":false},
   {"id":"extra","type":"kpi","label":"Additional visits","higher_is_better":false},
   {"id":"trend","type":"trend","label":"Daily OPD visit trend","span":6},
   {"id":"gender","type":"breakdown","chart":"donut","label":"Visits by gender","span":3},
   {"id":"age","type":"breakdown","chart":"bar","label":"Visits by age","span":3},
   {"id":"diag","type":"breakdown","chart":"bar","label":"Visits by diagnosis","span":4},
   {"id":"treat","type":"breakdown","chart":"bar","label":"Visits by treatment","span":4},
   {"id":"inv","type":"breakdown","chart":"donut","label":"Visits by investigation","span":4},
   {"id":"vasc","type":"combo","label":"Visits and average VAS by complaint","span":12,"bar_label":"Visits","line_label":"Avg VAS"}
  ]
 },
 "insights": {
  "source": "template", "scope": "All records", "notes": [],
  "summary": "Total OPD visits rose 18% (128 to 151). Average follow-up VAS fell 16% (1.71 to 1.44).",
  "findings": [
   {"severity":"high","text":"Activity peaked at 13 on Sep 06, well above the typical 6 per week."},
   {"severity":"medium","text":"Average follow-up VAS fell 16% (1.71 to 1.44)."},
   {"severity":"low","text":"'X-Ray' makes up 77% of visits by investigation."}]},
 "data": {
  "dates": {"baseline":"2026-10-01","current":"2026-10-30"},
  "widgets": {
   "visits":  {"current":{"value":151},"baseline":{"value":128}},
   "patients":{"current":{"value":137},"baseline":{"value":119}},
   "vas":     {"current":{"value":1.44},"baseline":{"value":1.71}},
   "extra":   {"current":{"value":14},"baseline":{"value":9}},
   "trend":{
    "current":{"labels":["Aug 30","Sep 02","Sep 06","Sep 09","Sep 13","Sep 16","Sep 20","Sep 23","Sep 27","Sep 30"],"values":[2,6,13,5,9,6,8,4,7,5]},
    "baseline":{"labels":["Aug 30","Sep 02","Sep 06","Sep 09","Sep 13","Sep 16","Sep 20","Sep 23","Sep 27","Sep 30"],"values":[2,5,10,4,8,5,6,3,5,4]}},
   "gender":{"current":{"labels":["Female","Male"],"values":[56,95]},"baseline":{"labels":["Female","Male"],"values":[48,80]}},
   "age":{"current":{"labels":["Under 18","18-39","40-59","60+"],"values":[11,43,55,42]},"baseline":{"labels":["Under 18","18-39","40-59","60+"],"values":[9,36,47,36]}},
   "diag":{"current":{"labels":["LBP non-radiation","Muscular back pain","Lower back pain","Muscular spasm","Not recorded","Shoulder dislocation"],"values":[15,9,7,7,7,6]},
           "baseline":{"labels":["LBP non-radiation","Muscular back pain","Lower back pain","Muscular spasm","Not recorded","Shoulder dislocation"],"values":[12,8,5,6,10,4]}},
   "treat":{"current":{"labels":["Meds","Meds + I.A inj","Meds + physio","Meds + backslab"],"values":[104,20,19,8]},
            "baseline":{"labels":["Meds","Meds + I.A inj","Meds + physio","Meds + backslab"],"values":[90,17,14,7]}},
   "inv":{"current":{"labels":["X-Ray","X-Ray + Lab","Lab","None"],"values":[116,23,8,4]},"baseline":{"labels":["X-Ray","X-Ray + Lab","Lab","None"],"values":[99,18,7,4]}},
   "vasc":{"current":{"labels":["Back pain","Lower back pain","Knee pain","Shoulder pain","Elbow pain"],"bar":[24,22,15,13,8],"line":[1.3,1.4,1.2,1.6,1.1]},
           "baseline":{"labels":["Back pain","Lower back pain","Knee pain","Shoulder pain","Elbow pain"],"bar":[20,19,12,10,6],"line":[1.6,1.7,1.5,1.9,1.3]}}
  }
 }
}
</script>

<script>
const {spec, data, insights} = JSON.parse(document.getElementById('payload').textContent);
const COL = {coral:'#ff8a65', lilac:'#c58bff', grey:'#7d74b8'};
const PALETTE = ['#ff8a65','#c58bff','#6ea8ff','#5be3a4','#ffd166','#ff6b7a'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
Chart.defaults.color = '#b9afe8';
Chart.defaults.font.family = '"Manrope","Segoe UI",system-ui,sans-serif';
Chart.defaults.borderColor = 'rgba(255,255,255,.08)';
Chart.defaults.animation = reduce ? false : {duration: 500};

const $ = id => document.getElementById(id);
const fmt = n => Number.isInteger(n) ? n.toLocaleString() : n.toFixed(2);
const W = id => data.widgets[id];

$('title').textContent = spec.title || 'Dashboard';
$('dates').textContent = `${data.dates.current} vs ${data.dates.baseline}`;


// Summary and findings: all text goes in via textContent, so data values can never inject markup
function renderInsights(ins){
  $('insights').hidden = false;
  const ai = ins.source === 'llm';
  $('insBadge').textContent = ai ? 'AI summary' : 'Auto summary';
  $('insBadge').classList.toggle('ai', ai);
  $('insScope').textContent = `${ins.scope || 'All records'}. ${data.dates.current} compared with ${data.dates.baseline}.`;
  $('insSum').textContent = ins.summary || '';
  $('insNote').textContent = (ins.notes || []).join(' ');
  const ul = $('alerts'); ul.innerHTML = '';
  for (const f of ins.findings || []){
    const li = document.createElement('li'), chip = document.createElement('span'), txt = document.createElement('span');
    chip.className = 'chip ' + (['high','medium','low'].includes(f.severity) ? f.severity : 'low');
    chip.textContent = f.severity; txt.textContent = f.text;
    li.append(chip, txt); ul.appendChild(li);
  }
  $('alertCount').textContent = (ins.findings || []).length;
}
if (insights) renderInsights(insights);

function kpiCard(w){
  const d = W(w.id), cur = d.current.value, base = d.baseline ? d.baseline.value : null;
  let delta = '<span class="flat">No baseline</span>';
  if (base !== null && base !== 0){
    const pct = (cur - base) / Math.abs(base) * 100;
    const good = w.higher_is_better === false ? pct < 0 : pct > 0;
    const cls = pct === 0 ? 'flat' : good ? 'up' : 'down';
    const arrow = pct === 0 ? '–' : pct > 0 ? '▲' : '▼';
    delta = `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span> vs ${fmt(base)}`;
  }
  const el = document.createElement('div');
  el.className = 'card kpi';
  el.innerHTML = `<h2></h2><div class="v"></div><div class="d">${delta}</div>`;   // delta is built from numbers only
  el.querySelector('h2').textContent = w.label;                                      // labels can come from an LLM
  el.querySelector('.v').textContent = fmt(cur);
  return el;
}

function chartCard(w){
  const span = w.span || (w.type === 'breakdown' ? 4 : 6);
  const el = document.createElement('div');
  el.className = 'card';
  el.style.gridColumn = `span ${span}`;
  el.innerHTML = `<h2></h2><div class="chart"><canvas></canvas></div>`;
  el.querySelector('h2').textContent = w.label;
  return el;
}

function draw(canvas, w){
  const d = W(w.id), c = d.current, b = d.baseline;
  if (w.type === 'trend'){
    const sets = [{label:'Current', data:c.values, borderColor:COL.coral, backgroundColor:COL.coral, tension:.35, pointRadius:2}];
    if (b) sets.push({label:'Baseline', data:b.values, borderColor:COL.grey, borderDash:[5,4], tension:.35, pointRadius:0});
    return new Chart(canvas, {type:'line', data:{labels:c.labels, datasets:sets}, options:{maintainAspectRatio:false, plugins:{legend:{display:!!b}}}});
  }
  if (w.type === 'breakdown' && w.chart === 'donut'){
    return new Chart(canvas, {type:'doughnut', data:{labels:c.labels, datasets:[{data:c.values, backgroundColor:PALETTE, borderWidth:0}]},
      options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom'}}}});
  }
  if (w.type === 'breakdown'){
    return new Chart(canvas, {type:'bar', data:{labels:c.labels, datasets:[{data:c.values, backgroundColor:COL.coral, borderRadius:3}]},
      options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}}}});
  }
  if (w.type === 'combo'){
    return new Chart(canvas, {data:{labels:c.labels, datasets:[
      {type:'bar', label:w.bar_label||'Count', data:c.bar, backgroundColor:COL.coral, borderRadius:3, yAxisID:'y'},
      {type:'line', label:w.line_label||'Average', data:c.line, borderColor:COL.lilac, backgroundColor:COL.lilac, tension:.35, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true}, y1:{position:'right', grid:{drawOnChartArea:false}}}}});
  }
}

for (const w of spec.widgets){
  if (w.type === 'kpi') $('kpis').appendChild(kpiCard(w));
  else { const card = chartCard(w); $('grid').appendChild(card); draw(card.querySelector('canvas'), w); }
}

// Comparison: any breakdown widget, or the bar series of a combo widget
const cmpWidgets = spec.widgets.filter(w => (w.type === 'breakdown' || w.type === 'combo') && W(w.id).baseline);
let cmpChart = null;
function series(p){ return p.values || p.bar; }
function showCompare(w){
  const c = W(w.id).current, b = W(w.id).baseline;
  const labels = [...new Set([...c.labels, ...b.labels])];
  const pick = p => labels.map(l => { const i = p.labels.indexOf(l); return i < 0 ? 0 : series(p)[i]; });
  $('cmpTitle').textContent = w.label;
  $('cmpNote').textContent = `${data.dates.baseline} compared with ${data.dates.current}`;
  if (cmpChart) cmpChart.destroy();
  cmpChart = new Chart($('cmpChart'), {type:'bar', data:{labels, datasets:[
      {label:data.dates.baseline, data:pick(b), backgroundColor:COL.grey, borderRadius:3},
      {label:data.dates.current, data:pick(c), backgroundColor:COL.coral, borderRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{position:'top'}}}});
  document.querySelectorAll('#dims .btn').forEach(x => x.classList.toggle('on', x.dataset.id === w.id));
}
if (cmpWidgets.length){
  for (const w of cmpWidgets){
    const btn = document.createElement('button');
    btn.className = 'btn'; btn.dataset.id = w.id;
    btn.textContent = w.label.replace(/^.*? by /i, '').replace(/^./, s => s.toUpperCase());
    btn.onclick = () => showCompare(w);
    $('dims').appendChild(btn);
  }
  showCompare(cmpWidgets[0]);
} else {
  $('cmp').innerHTML = '<p class="empty">No baseline data to compare. Pick a second date.</p>';
}
</script>
</body>
</html>
